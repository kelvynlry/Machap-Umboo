<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1080x1440 Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.2.4/fabric.min.js"></script>

<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #e8e8e8;
    margin: 0;
    padding: 0;
  }

  /* 新的画布容器 */
  .canvas-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 20px auto;
    border: 4px solid #333;
    background: white;
    width: 1080px;
    height: 1440px;

    /* 保证位置正确 */
    transform-origin: top left;
  }

  canvas {
    border: 1px solid #999;
    background: white;
  }

  /* 手机适配 */
  @media (max-width: 600px) {
    .canvas-wrapper {
      transform: scale(0.3);
      margin-top: 0;
    }
  }

  /* emoji 网格 */
  .emoji-container {
    width: 90%;
    max-width: 360px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    padding: 10px;
    max-height: 180px;
    overflow-y: auto;
    background: white;
    border: 1px solid #ccc;
  }

  .emoji-container img {
    width: 50px;
    cursor: pointer;
  }
</style>
</head>

<body>

<h2>树赢仔贴纸</h2>

<div>
  <input type="file" id="uploadImage" accept="image/*">
  <button id="toggleFrame">切换边框</button>
  <button id="deleteSelected">删除选中对象</button>
  <button id="download">下载高清图</button>
</div>

<h3>选择 Emoji:</h3>
<div class="emoji-container">
  <script>
    for (let i = 1; i <= 27; i++) {
      document.write(`<img src="emoji${i}.png" class="emoji-option">`);
    }
  </script>
</div>

<h3>控制选中对象</h3>
<div>
  <button id="scaleUp">放大+</button>
  <button id="scaleDown">缩小-</button>
  <button id="rotateLeft">左旋转 ↺</button>
  <button id="rotateRight">右旋转 ↻</button>
</div>

<div class="canvas-wrapper">
  <canvas id="editorCanvas" width="1080" height="1440"></canvas>
</div>

<script src="editor.js"></script>

</body>
</html>
