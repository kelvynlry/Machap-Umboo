<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>照片编辑器</title>
<style>
    body {
        font-family: sans-serif;
        text-align: center;
        background: #f5f5f5;
    }

    #editor-area {
        width: 350px;
        height: 350px;
        margin: 20px auto;
        background: white;
        position: relative;
        overflow: hidden;
        border: 2px solid #ccc;
        border-radius: 10px;
        touch-action: none;
    }

    #user-photo {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: center center;
        touch-action: none;
    }

    .sticker {
        position: absolute;
        width: 100px;
        cursor: move;
        user-select: none;
        touch-action: none;
    }

    #frame {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    .btn {
        padding: 10px 15px;
        margin: 10px;
        border: none;
        background: #007bff;
        color: white;
        border-radius: 6px;
        cursor: pointer;
    }

    .btn:hover {
        background: #0056b3;
    }

    #sticker-list img, #frame-list img {
        width: 70px;
        margin: 5px;
        cursor: pointer;
    }
</style>
</head>
<body>

<h2>照片编辑器（手机 & 电脑都能用）</h2>

<input type="file" id="upload-photo" accept="image/*" class="btn">

<div id="editor-area">
    <img id="user-photo">
    <img id="frame">
</div>

<h3>选择边框（可选）</h3>
<div id="frame-list">
    <!-- 示例，用你自己的框 -->
    <img src="frame1.png" onclick="setFrame(this.src)">
    <img src="frame2.png" onclick="setFrame(this.src)">
    <img src="frame3.png" onclick="removeFrame()">
</div>

<h3>选择贴纸</h3>
<div id="sticker-list">
    <!-- 你有30个贴纸，示例显示3个 -->
    <img src="sticker1.png" onclick="addSticker(this.src)">
    <img src="sticker2.png" onclick="addSticker(this.src)">
    <img src="sticker3.png" onclick="addSticker(this.src)">
</div>

<button class="btn" onclick="downloadImage()">下载高清图</button>

<script>
let userPhoto = document.getElementById("user-photo");
let editor = document.getElementById("editor-area");

// 上传图片
document.getElementById("upload-photo").onchange = function(e) {
    let file = e.target.files[0];
    userPhoto.src = URL.createObjectURL(file);
};

// 设置边框
function setFrame(src) {
    document.getElementById("frame").src = src;
}
function removeFrame() {
    document.getElementById("frame").src = "";
}

// 添加贴纸
function addSticker(src) {
    let img = document.createElement("img");
    img.src = src;
    img.className = "sticker";
    
    img.style.left = "100px";
    img.style.top = "100px";
    
    editor.appendChild(img);

    enableDragAndScale(img);
}

// 启用贴纸拖动 + 缩放
function enableDragAndScale(el) {
    let isDragging = false;
    let startX, startY;

    el.addEventListener("pointerdown", e => {
        isDragging = true;
        startX = e.clientX - el.offsetLeft;
        startY = e.clientY - el.offsetTop;
        el.setPointerCapture(e.pointerId);
    });

    el.addEventListener("pointermove", e => {
        if (!isDragging) return;
        el.style.left = (e.clientX - startX) + "px";
        el.style.top = (e.clientY - startY) + "px";
    });

    el.addEventListener("pointerup", () => isDragging = false);

    // 双指缩放
    let scale = 1;
    let startingDistance = 0;

    el.addEventListener("touchmove", e => {
        if (e.touches.length == 2) {
            e.preventDefault();
            let dx = e.touches[0].clientX - e.touches[1].clientX;
            let dy = e.touches[0].clientY - e.touches[1].clientY;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (startingDistance === 0) {
                startingDistance = dist;
            } else {
                scale *= dist / startingDistance;
                el.style.transform = `scale(${scale})`;
                startingDistance = dist;
            }
        }
    });

    el.addEventListener("touchend", () => startingDistance = 0);
}

// 生成高清图
function downloadImage() {
    let canvas = document.createElement("canvas");
    let size = 1000; // 大图
    canvas.width = size;
    canvas.height = size;
    let ctx = canvas.getContext("2d");

    // 绘制用户照片
    ctx.drawImage(userPhoto, 0, 0, size, size);

    // 绘制贴纸
    document.querySelectorAll(".sticker").forEach(st => {
        let rect = st.getBoundingClientRect();
        let eRect = editor.getBoundingClientRect();
        let x = (rect.left - eRect.left) * (size / eRect.width);
        let y = (rect.top - eRect.top) * (size / eRect.height);
        let w = st.offsetWidth * (size / eRect.width);
        let h = st.offsetHeight * (size / eRect.height);

        ctx.drawImage(st, x, y, w, h);
    });

    // 绘制边框
    let frame = document.getElementById("frame");
    if (frame.src) ctx.drawImage(frame, 0, 0, size, size);

    // 下载
    let link = document.createElement("a");
    link.download = "result.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}
</script>

</body>
</html>
