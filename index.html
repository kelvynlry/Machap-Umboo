<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Editor 1080×1440</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.2.4/fabric.min.js"></script>
<style>
  body { text-align: center; font-family: Arial; background: #f0f0f0; }
  canvas { border: 1px solid #ccc; }
  .tools { margin: 20px; }
</style>
</head>
<body>

<h2>Photo + Emoji Editor (1080x1440)</h2>

<!-- Tools -->
<div class="tools">
  <input type="file" id="uploadImage" accept="image/*">
  <button id="addEmoji">Add Emoji</button>
  <button id="toggleFrame">Toggle Frame</button>
  <button id="deleteSelected">Delete Selected</button>
  <button id="download">Download 1080x1440</button>
</div>

<!-- Canvas -->
<canvas id="editorCanvas" width="360" height="480"></canvas>

<script src="editor.js"></script>

</body>
</html>
