<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1080x1440 照片编辑器</title>

<style>
    body { text-align: center; background: #f4f4f4; font-family: Arial; }

    #editor {
        width: 360px;           /* 预览比例是 1/3 ，不变形 */
        height: 480px;
        position: relative;
        margin: 20px auto;
        background: #ddd;
        overflow: hidden;
        border-radius: 10px;
        touch-action: none;
    }

    #photo {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: center;
        touch-action: none;
    }

    #frame {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    .sticker {
        position: absolute;
        width: 100px;
        touch-action: none;
        cursor: move;
        user-select: none;
    }

    .thumb { width: 70px; margin: 5px; cursor: pointer; }

    .btn {
        padding: 10px 15px;
        margin: 8px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }
</style>

</head>
<body>

<h2>1080x1440 编辑器</h2>

<input type="file" id="upload" accept="image/*" class="btn">

<div id="editor">
    <img id="photo">
    <img id="frame">
</div>

<h3>选择边框</h3>
<div>
    <img src="frame1.png" class="thumb" onclick="setFrame(this.src)">
    <img src="frame2.png" class="thumb" onclick="setFrame(this.src)">
    <img src="" class="thumb" onclick="removeFrame()">
</div>

<h3>添加贴纸</h3>
<div>
    <img src="sticker1.png" class="thumb" onclick="addSticker(this.src)">
    <img src="sticker2.png" class="thumb" onclick="addSticker(this.src)">
    <img src="sticker3.png" class="thumb" onclick="addSticker(this.src)">
</div>

<button class="btn" onclick="downloadHD()">下载 1080x1440 高清图</button>

<script>
const editor = document.getElementById("editor");
const photo = document.getElementById("photo");

document.getElementById("upload").onchange = e => {
    let file = e.target.files[0];
    if (file) photo.src = URL.createObjectURL(file);
};

// 切换/移除边框
function setFrame(src){ document.getElementById("frame").src = src; }
function removeFrame(){ document.getElementById("frame").src = ""; }

// 添加贴纸
function addSticker(src){
    let st = document.createElement("img");
    st.src = src;
    st.className = "sticker";
    st.style.left = "120px";
    st.style.top = "150px";
    editor.appendChild(st);
    enableStickerControl(st);
}

// 贴纸拖动 & 缩放
function enableStickerControl(el){
    let dragging = false, startX, startY;
    let scale = 1, base = 0;

    el.addEventListener("pointerdown", e => {
        dragging = true;
        startX = e.clientX - el.offsetLeft;
        startY = e.clientY - el.offsetTop;
        el.setPointerCapture(e.pointerId);
    });

    el.addEventListener("pointermove", e => {
        if (!dragging) return;
        el.style.left = (e.clientX - startX) + "px";
        el.style.top = (e.clientY - startY) + "px";
    });

    el.addEventListener("pointerup", ()=> dragging = false);

    // 手机双指缩放
    el.addEventListener("touchmove", e => {
        if (e.touches.length === 2){
            e.preventDefault();
            let dx = e.touches[0].clientX - e.touches[1].clientX;
            let dy = e.touches[0].clientY - e.touches[1].clientY;
            let d = Math.sqrt(dx*dx + dy*dy);
            if (!base) base = d;
            scale *= d / base;
            el.style.transform = `scale(${scale})`;
            base = d;
        }
    });

    el.addEventListener("touchend", ()=> base = 0);
}

// 下载固定 1080×1440 高清
function downloadHD(){
    let canvas = document.createElement("canvas");
    canvas.width = 1080;
    canvas.height = 1440;
    let ctx = canvas.getContext("2d");

    let rect = editor.getBoundingClientRect();

    // 画用户照片
    ctx.drawImage(photo, 0, 0, 1080, 1440);

    // 画贴纸
    document.querySelectorAll(".sticker").forEach(st => {
        let r = st.getBoundingClientRect();
        let scaleX = 1080 / rect.width;
        let scaleY = 1440 / rect.height;

        let x = (r.left - rect.left) * scaleX;
        let y = (r.top - rect.top) * scaleY;
        let w = st.offsetWidth * scaleX;
        let h = st.offsetHeight * scaleY;

        ctx.save();
        ctx.translate(x + w/2, y + h/2);
        let transform = st.style.transform.match(/scale\((.*?)\)/);
        let sc = transform ? parseFloat(transform[1]) : 1;
        ctx.scale(sc, sc);
        ctx.drawImage(st, -w/2, -h/2, w, h);
        ctx.restore();
    });

    // 画边框
    let frame = document.getElementById("frame");
    if (frame.src) ctx.drawImage(frame, 0, 0, 1080, 1440);

    // 下载
    let link = document.createElement("a");
    link.download = "1080x1440_result.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}
</script>
</body>
</html>
