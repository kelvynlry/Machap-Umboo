<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竖版照片编辑器</title>
<style>
    body {
        font-family: sans-serif;
        text-align: center;
        background: #f0f0f0;
    }

    #editor-area {
        width: 360px; /* 预览区域大小，手机也适合 */
        height: 480px;
        background: #fff;
        position: relative;
        margin: 20px auto;
        overflow: hidden;
        border-radius: 10px;
    }

    #user-photo {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform-origin: center;
    }

    #frame {
        position: absolute;
        top: 0;
        left: 0;
        width: 360px;
        height: 480px;
        pointer-events: none;
    }

    .sticker {
        position: absolute;
        width: 120px;
        touch-action: none;
        user-select: none;
        cursor: move;
    }

    #sticker-list img, #frame-list img {
        width: 80px;
        margin: 5px;
        cursor: pointer;
    }

    .btn {
        padding: 10px 15px;
        background: #007bff;
        border: none;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        margin: 10px;
    }
</style>
</head>
<body>

<h2>1080x1440 竖版照片编辑器</h2>

<input type="file" id="upload-photo" accept="image/*" class="btn">

<div id="editor-area">
    <img id="user-photo">
    <img id="frame">
</div>

<h3>选择边框</h3>
<div id="frame-list">
    <img src="frame1080x1440.png" onclick="setFrame(this.src)">
    <img src="" onclick="removeFrame()">
</div>

<h3>选择贴纸</h3>
<div id="sticker-list">
    <img src="sticker1.png" onclick="addSticker(this.src)">
    <img src="sticker2.png" onclick="addSticker(this.src)">
    <img src="sticker3.png" onclick="addSticker(this.src)">
</div>

<button class="btn" onclick="downloadImage()">下载 1080x1440 高清图</button>

<script>
let userPhoto = document.getElementById("user-photo");
let editor = document.getElementById("editor-area");

// 上传照片
document.getElementById("upload-photo").onchange = function(e){
    let file = e.target.files[0];
    if (file) userPhoto.src = URL.createObjectURL(file);
};

// 设置/取消框
function setFrame(src){
    document.getElementById("frame").src = src;
}
function removeFrame(){
    document.getElementById("frame").src = "";
}

// 添加贴纸
function addSticker(src){
    let st = document.createElement("img");
    st.src = src;
    st.className = "sticker";
    st.style.left = "100px";
    st.style.top = "100px";
    editor.appendChild(st);

    enableStickerControls(st);
}

// 贴纸拖动 + 双指缩放
function enableStickerControls(el){
    let dragging = false;
    let startX, startY;

    el.addEventListener("pointerdown", e => {
        dragging = true;
        startX = e.clientX - el.offsetLeft;
        startY = e.clientY - el.offsetTop;
        el.setPointerCapture(e.pointerId);
    });

    el.addEventListener("pointermove", e => {
        if (!dragging) return;
        el.style.left = (e.clientX - startX) + "px";
        el.style.top = (e.clientY - startY) + "px";
    });

    el.addEventListener("pointerup", ()=> dragging = false);

    // 双指缩放
    let scale = 1;
    let baseDistance = 0;

    el.addEventListener("touchmove", e => {
        if (e.touches.length === 2){
            e.preventDefault();
            let dx = e.touches[0].clientX - e.touches[1].clientX;
            let dy = e.touches[0].clientY - e.touches[1].clientY;
            let dist = Math.sqrt(dx*dx + dy*dy);

            if (baseDistance === 0) baseDistance = dist;
            else {
                scale *= dist / baseDistance;
                el.style.transform = `scale(${scale})`;
                baseDistance = dist;
            }
        }
    });

    el.addEventListener("touchend", ()=> baseDistance = 0);
}

// 下载高清图
function downloadImage(){
    let W = userPhoto.naturalWidth;
    let H = userPhoto.naturalHeight;

    if (!W || !H){
        alert("请先上传照片");
        return;
    }

    let canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    let ctx = canvas.getContext("2d");

    // 把用户照片画成原图尺寸
    ctx.drawImage(userPhoto, 0, 0, W, H);

    // 贴纸缩放计算
    let editorRect = editor.getBoundingClientRect();

    document.querySelectorAll(".sticker").forEach(st => {
        let stRect = st.getBoundingClientRect();

        let x = (stRect.left - editorRect.left) * (W / editorRect.width);
        let y = (stRect.top - editorRect.top) * (H / editorRect.height);
        let w = st.offsetWidth * (W / editorRect.width);
        let h = st.offsetHeight * (H / editorRect.height);

        ctx.drawImage(st, x, y, w, h);
    });

    // 框缩放计算
    let frame = document.getElementById("frame");
    if (frame.src){
        ctx.drawImage(frame, 0, 0, W, H);
    }

    // 下载高清原尺寸
    let link = document.createElement("a");
    link.download = "HD_result.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
}
</script>
</body>
</html>
