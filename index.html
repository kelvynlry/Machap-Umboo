<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1080x1440 Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.2.4/fabric.min.js"></script>

<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #e8e8e8;
    margin: 0;
    padding: 0;
  }

  /* 画布显示外框，让用户清楚看到范围 */
  .canvas-wrapper {
    width: 1080px;
    height: 1440px;
    margin: 20px auto;
    border: 4px solid #333;
    background: white;
    transform-origin: top center;
  }

  canvas {
    border: 1px solid #999; /* 画布线条，让用户能看到边 */
    background: #ffffff;
  }

  .emoji-container {
    width: 90%;
    max-width: 360px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    padding: 10px;
    max-height: 180px;
    overflow-y: scroll;
    background: white;
    border: 1px solid #ccc;
  }

  .emoji-container img {
    width: 50px;
    cursor: pointer;
    border: 2px solid transparent;
  }

  .emoji-container img:hover {
    border-color: #000;
  }
</style>
</head>

<body>

<h2>树赢仔贴纸</h2>

<div>
  <input type="file" id="uploadImage" accept="image/*">
  <button id="toggleFrame">切换边框</button>
  <button id="deleteSelected">删除选中对象</button>
  <button id="download">下载高清图</button>
</div>

<h3>选择 Emoji:</h3>
<div class="emoji-container">
  <script>
    for (let i = 1; i <= 27; i++) {
      document.write(`<img src="emoji${i}.png" class="emoji-option">`);
    }
  </script>
</div>

<!-- 控制按钮 -->
<div>
  <button id="scaleUp">放大+</button>
  <button id="scaleDown">缩小-</button>
  <button id="rotateLeft">左旋转 ↺</button>
  <button id="rotateRight">右旋转 ↻</button>
</div>

<!-- 画布区 -->
<div id="canvasContainer" class="canvas-wrapper">
  <canvas id="editorCanvas" width="1080" height="1440"></canvas>
</div>

<script src="editor.js"></script>

<script>
/* 自动缩放画布以适配手机 */
function adjustScale() {
  const wrapper = document.querySelector(".canvas-wrapper");
  const screenWidth = window.innerWidth;

  if (screenWidth < 600) {
    const scale = screenWidth / 1080;
    wrapper.style.transform = `scale(${scale})`;
  } else {
    wrapper.style.transform = "scale(0.33)";
  }
}

window.addEventListener("load", adjustScale);
window.addEventListener("resize", adjustScale);
</script>

</body>
</html>
