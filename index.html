<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1080x1440 Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.2.4/fabric.min.js"></script>

<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #f1f1f1;
  }
  .canvas-wrapper {
    transform: scale(0.33);
    transform-origin: top left;
    width: 360px;
    height: 480px;
    margin: 0 auto;
  }
  canvas {
    border: 1px solid #000;
  }
  .tools {
    margin: 10px;
  }
  .emoji-container img {
    width: 60px;
    margin: 5px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .emoji-container img:hover {
    border-color: #000;
  }
</style>
</head>

<body>

<h2>树赢仔贴纸</h2>

<div class="tools">
  <input type="file" id="uploadImage" accept="image/*"><br><br>
  <button id="toggleFrame">切换边框</button>
  <button id="deleteSelected">删除选中对象</button>
  <button id="download">下载（1080x1440）</button>
</div>

<h3>选择 Emoji:</h3>
<div class="emoji-container">
  <img src="emoji1.png" class="emoji-option">
  <img src="emoji2.png" class="emoji-option">
  <img src="emoji3.png" class="emoji-option">
  <img src="emoji4.png" class="emoji-option">
  <img src="emoji5.png" class="emoji-option">
  <img src="emoji6.png" class="emoji-option">
  <img src="emoji7.png" class="emoji-option">
  <img src="emoji8.png" class="emoji-option">
  <img src="emoji9.png" class="emoji-option">
  <img src="emoji10.png" class="emoji-option">
  <img src="emoji11.png" class="emoji-option">
  <img src="emoji12.png" class="emoji-option">
  <img src="emoji13.png" class="emoji-option">
  <img src="emoji14.png" class="emoji-option">
  <img src="emoji15.png" class="emoji-option">
  <img src="emoji16.png" class="emoji-option">
  <img src="emoji17.png" class="emoji-option">
  <img src="emoji18.png" class="emoji-option">
  <img src="emoji19.png" class="emoji-option">
  <img src="emoji20.png" class="emoji-option">
  <img src="emoji21.png" class="emoji-option">
  <img src="emoji22.png" class="emoji-option">
  <img src="emoji23.png" class="emoji-option">
  <img src="emoji24.png" class="emoji-option">
  <img src="emoji25.png" class="emoji-option">
  <img src="emoji26.png" class="emoji-option">
  <img src="emoji27.png" class="emoji-option">
</div>

<div class="canvas-wrapper">
  <canvas id="editorCanvas" width="1080" height="1440"></canvas>
</div>

<script src="editor.js"></script>

</body>
</html>
