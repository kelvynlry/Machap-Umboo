<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1080x1440 Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.2.4/fabric.min.js"></script>

<style>
  body {
    font-family: Arial;
    text-align: center;
    background: #f1f1f1;
  }

  .canvas-wrapper {
    transform: scale(0.33);
    transform-origin: top left;
    width: 360px;
    height: 480px;
    margin: 20px auto;
  }

  canvas {
    border: 1px solid #000;
  }

  .tools {
    margin: 10px;
  }

  /* Emoji 格子布局 */
  .emoji-container {
    width: 360px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    padding: 10px;
    max-height: 180px;
    overflow-y: scroll;
    background: white;
    border: 1px solid #ccc;
  }

  .emoji-container img {
    width: 50px;
    cursor: pointer;
    border: 2px solid transparent;
  }
  .emoji-container img:hover {
    border-color: #000;
  }

  /* 控制按钮 */
  .edit-controls button {
    padding: 6px 12px;
    margin: 3px;
  }
</style>

</head>

<body>

<h2>树赢仔贴纸</h2>

<div class="tools">
  <input type="file" id="uploadImage" accept="image/*"><br><br>
  <button id="toggleFrame">切换边框 Change Frame</button>
  <button id="deleteSelected">删除选中对象 Delete Item</button>
  <button id="download">下载 Download</button>
</div>

<h3>选择 Emoji:</h3>
<div class="emoji-container">
  <!-- 自动加载 emoji1.png 到 emoji39.png -->
  <script>
    for (let i = 1; i <= 39; i++) {
      document.write(`<img src="emoji${i}.png" class="emoji-option">`);
    }
  </script>
</div>

<h3>对象控制</h3>
<div class="edit-controls">
  <button id="scaleUp">放大 Zoom In +</button>
  <button id="scaleDown">缩小 Zoom Out -</button>
  <button id="rotateLeft">左旋转 Rotate Left ↺</button>
  <button id="rotateRight">右旋转 Rotate Right ↻</button>
</div>

<div class="canvas-wrapper">
  <canvas id="editorCanvas" width="1080" height="1440"></canvas>
</div>

<script src="editor.js"></script>

</body>
</html>
