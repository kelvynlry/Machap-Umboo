<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>树赢仔像框生成器</title>
<style>
body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 20px;
}
#canvasContainer {
    position: relative;
    width: 400px;
    height: 400px;
    border: 1px solid #ccc;
    cursor: grab;
    touch-action: none;
}
canvas {
    position: absolute;
    top: 0;
    left: 0;
}
#frameCanvas {
    pointer-events: none; /* 框不拦截鼠标事件 */
}
input, button {
    margin-top: 10px;
}
button {
    padding: 6px 16px;
    font-size: 16px;
}
</style>
</head>
<body>

<h2>树赢仔像框生成器</h2>
<input type="file" id="upload" accept="image/*">
<div id="canvasContainer">
    <canvas id="photoCanvas" width="400" height="400"></canvas>
    <canvas id="frameCanvas" width="400" height="400"></canvas>
</div>
<button id="downloadBtn">下载高清头像</button>

<script>
const photoCanvas = document.getElementById('photoCanvas');
const frameCanvas = document.getElementById('frameCanvas');
const photoCtx = photoCanvas.getContext('2d');
const frameCtx = frameCanvas.getContext('2d');
const uploadInput = document.getElementById('upload');
const downloadBtn = document.getElementById('downloadBtn');

// 高清下载尺寸
const HD_SIZE = 2000;

let photoImg = new Image();
let frameImg = new Image();
frameImg.src = 'frame.png'; // 透明框 PNG
frameImg.onload = () => {
    frameCtx.clearRect(0,0,frameCanvas.width,frameCanvas.height);
    frameCtx.drawImage(frameImg,0,0,frameCanvas.width,frameCanvas.height);
}

// 控制变量
let offsetX=0, offsetY=0;
let scale=1;
let imgNaturalWidth=0, imgNaturalHeight=0;
let isDragging=false;
let startX, startY;
let lastDistance=0;

// 上传头像
uploadInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = evt=>{
        photoImg.src = evt.target.result;
    }
    reader.readAsDataURL(file);
});

photoImg.onload = ()=>{
    imgNaturalWidth = photoImg.naturalWidth;
    imgNaturalHeight = photoImg.naturalHeight;

    // 按照 canvas 尺寸自适应，同时保持比例
    const canvasRatio = photoCanvas.width / photoCanvas.height;
    const imgRatio = imgNaturalWidth / imgNaturalHeight;

    if(imgRatio > canvasRatio){
        scale = photoCanvas.width / imgNaturalWidth;
    } else {
        scale = photoCanvas.height / imgNaturalHeight;
    }

    // 初始位置居中
    const w = imgNaturalWidth * scale;
    const h = imgNaturalHeight * scale;
    offsetX = (photoCanvas.width - w)/2;
    offsetY = (photoCanvas.height - h)/2;

    drawPhoto();
}

// 绘制头像
function drawPhoto(){
    photoCtx.clearRect(0,0,photoCanvas.width,photoCanvas.height);
    const w = imgNaturalWidth * scale;
    const h = imgNaturalHeight * scale;
    photoCtx.drawImage(photoImg, offsetX, offsetY, w, h);
}

// 鼠标拖动
photoCanvas.addEventListener('mousedown', e=>{
    isDragging=true;
    startX=e.offsetX - offsetX;
    startY=e.offsetY - offsetY;
    photoCanvas.style.cursor='grabbing';
});
photoCanvas.addEventListener('mousemove', e=>{
    if(!isDragging) return;
    offsetX = e.offsetX - startX;
    offsetY = e.offsetY - startY;
    drawPhoto();
});
photoCanvas.addEventListener('mouseup', ()=>{ isDragging=false; photoCanvas.style.cursor='grab'; });
photoCanvas.addEventListener('mouseleave', ()=>{ isDragging=false; photoCanvas.style.cursor='grab'; });

// 鼠标滚轮缩放（缩放中心为鼠标位置）
photoCanvas.addEventListener('wheel', e=>{
    e.preventDefault();
    const oldScale = scale;
    const delta = e.deltaY<0?0.05:-0.05;
    scale += delta;
    if(scale<0.1) scale=0.1;
    if(scale>5) scale=5;

    const mouseX = e.offsetX;
    const mouseY = e.offsetY;
    offsetX = mouseX - (mouseX - offsetX)*(scale/oldScale);
    offsetY = mouseY - (mouseY - offsetY)*(scale/oldScale);

    drawPhoto();
});

// 触屏拖动 + 捏合缩放
photoCanvas.addEventListener('touchstart', e=>{
    e.preventDefault();
    if(e.touches.length===1){
        isDragging=true;
        startX = e.touches[0].clientX - offsetX;
        startY = e.touches[0].clientY - offsetY;
    } else if(e.touches.length===2){
        isDragging=false;
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        lastDistance = Math.sqrt(dx*dx + dy*dy);
    }
});
photoCanvas.addEventListener('touchmove', e=>{
    e.preventDefault();
    if(e.touches.length===1 && isDragging){
        offsetX = e.touches[0].clientX - startX;
        offsetY = e.touches[0].clientY - startY;
        drawPhoto();
    } else if(e.touches.length===2){
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const distance = Math.sqrt(dx*dx + dy*dy);
        const factor = distance / lastDistance;
        scale *= factor;
        if(scale<0.1) scale=0.1;
        if(scale>5) scale=5;
        lastDistance = distance;

        const midX = (e.touches[0].clientX + e.touches[1].clientX)/2;
        const midY = (e.touches[0].clientY + e.touches[1].clientY)/2;
        offsetX = midX - (midX - offsetX)*factor;
        offsetY = midY - (midY - offsetY)*factor;

        drawPhoto();
    }
});
photoCanvas.addEventListener('touchend', e=>{ if(e.touches.length===0) isDragging=false; });

// 下载高清 PNG
downloadBtn.addEventListener('click', ()=>{
    if(!photoImg.src) return alert("请先上传照片！");
    const hdCanvas = document.createElement('canvas');
    hdCanvas.width = HD_SIZE;
    hdCanvas.height = HD_SIZE;
    const ctx = hdCanvas.getContext('2d');

    const factor = HD_SIZE / photoCanvas.width;
    const w = imgNaturalWidth * scale * factor;
    const h = imgNaturalHeight * scale * factor;
    ctx.drawImage(photoImg, offsetX*factor, offsetY*factor, w, h);

    ctx.drawImage(frameImg,0,0,HD_SIZE,HD_SIZE);

    hdCanvas.toBlob(blob=>{
        const link = document.createElement('a');
        link.download='avatar_hd.png';
        link.href=URL.createObjectURL(blob);
        link.click();
    },'image/png');
});
</script>

</body>
</html>
